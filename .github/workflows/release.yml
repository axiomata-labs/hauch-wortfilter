# A tag `v1.2.0` builds the plugin and publishes a release with its two assets, plugin.json and plugin.wasm — what
# Hauch installs from `owner/repo`. Every push builds it once, so a broken build shows before a tag. The build reads
# only; the one job that may write runs on a tag, after it, and checks nothing out.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust with the target wasm32-wasip2
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - name: Test
        run: cargo test
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION=0.0.0-dev ;; esac
          scripts/release.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/plugin.json dist/plugin.wasm
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
